# FlareDispatch — deploy the Workers into YOUR Cloudflare account.
#
# Composite action over `fd deploy` (specs/operability.md § Deploy pipeline). Your repository carries the operator
# overlay — the values-only JSON the value schema declares (account id, D1/KV/R2 identifiers, hostnames, Access
# settings, operators, GitHub App id, alert sink) — and a 40-char SHA pinning the upstream commit. The action checks
# out FlareDispatch at that SHA and runs `fd deploy --overlay @<your overlay>` from the upstream tree. `fd deploy`
# renders each committed Worker template through the one renderer (FD-OPS-007), runs the drift check, the D1
# migrations, the Worker deploys and the post-deploy probes, and stores the record of the deploy. The action writes no
# Worker configuration of its own: topology comes only from the upstream templates.
name: FlareDispatch — Deploy
description: >-
  Deploy the FlareDispatch Workers into your Cloudflare account with `fd deploy`, from a values-only operator overlay
  and a pinned upstream SHA.
author: fractalboxdev
branding:
  icon: cloud
  color: orange

inputs:
  upstream-ref:
    description: >-
      Git ref on the upstream repository to check out. Almost always a 40-char commit SHA pinned in your repo (e.g. the
      contents of `infra/flare-dispatch/UPSTREAM_SHA`); a branch or tag also works but is not reproducible. An empty
      value fails before checkout.
    required: true

  overlay:
    description: >-
      Path, relative to your repository root, to the operator overlay: the values-only JSON file the value schema of
      specs/operability.md declares. `fd deploy` renders it into the upstream templates; a key the schema does not
      declare, or a missing required value, fails the deploy before any Cloudflare change.
    required: true

  cloudflare-api-token:
    description: >-
      Account-scoped Cloudflare API token: Workers Scripts:Edit, Workers R2 Storage:Edit, D1:Edit, Containers:Edit,
      Account Settings:Read. `fd deploy` passes it to `wrangler` and reads the deployed settings with it.
    required: true

  github-app-private-key:
    description: >-
      The GitHub App's private key. The drift check reads the App's registration and the default branch's ruleset of
      the repository this workflow runs in.
    required: true

  mameko-deploy-key:
    description: Read-only deploy key of the private mameko repository, which the upstream tree vendors as a submodule.
    required: true

  dry-run:
    description: >-
      `true` runs decode, render and the drift check only (`fd deploy --dry-run`) and changes no Cloudflare state.
    required: false
    default: "false"

  node-version:
    description: Node version. Defaults to 22 (matches upstream's CI).
    required: false
    default: "22"

  upstream-repo:
    description: >-
      Upstream FlareDispatch repo to check out. Default is the canonical repo; an enterprise mirror or private fork can
      override.
    required: false
    default: fractalboxdev/flare-dispatch

  upstream-checkout-path:
    description: Relative path the upstream tree is checked out into.
    required: false
    default: flare-dispatch-upstream

outputs:
  upstream-sha:
    description: The ref the upstream was checked out at.
    value: ${{ steps.resolve-pin.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Resolve upstream pin
      id: resolve-pin
      shell: bash
      env:
        REF: ${{ inputs.upstream-ref }}
      run: |
        if [ -z "$REF" ]; then
          echo "::error title=upstream-ref empty::Set inputs.upstream-ref to a SHA from the upstream repository (typically the contents of your repo's UPSTREAM_SHA pin file)." >&2
          exit 1
        fi
        if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "::warning title=upstream-ref is not a 40-char SHA::Got '$REF'. Branch and tag pins are not reproducible; pin to a commit SHA." >&2
        fi
        echo "sha=$REF" >> "$GITHUB_OUTPUT"

    - name: Locate the operator overlay
      id: overlay
      # Resolved to an absolute path here, in the caller's workspace: `fd deploy` runs from the upstream tree.
      shell: bash
      env:
        OVERLAY: ${{ inputs.overlay }}
      run: |
        if [ ! -f "$OVERLAY" ]; then
          echo "::error title=overlay missing::No file at '$OVERLAY'. Set inputs.overlay to the path of your operator overlay JSON (relative to the repo root)." >&2
          exit 1
        fi
        echo "path=$(cd "$(dirname "$OVERLAY")" && pwd)/$(basename "$OVERLAY")" >> "$GITHUB_OUTPUT"

    - name: Checkout upstream FlareDispatch
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.upstream-repo }}
        ref: ${{ steps.resolve-pin.outputs.sha }}
        path: ${{ inputs.upstream-checkout-path }}

    - name: Fetch vendor/mameko
      shell: bash
      working-directory: ${{ inputs.upstream-checkout-path }}
      env:
        MAMEKO_DEPLOY_KEY: ${{ inputs.mameko-deploy-key }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$MAMEKO_DEPLOY_KEY" > ~/.ssh/mameko
        chmod 600 ~/.ssh/mameko
        GIT_SSH_COMMAND="ssh -i ~/.ssh/mameko -o IdentitiesOnly=yes" git submodule update --init vendor/mameko

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ inputs.upstream-checkout-path }}/package.json
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.upstream-checkout-path }}/pnpm-lock.yaml

    - name: Install upstream dependencies
      shell: bash
      working-directory: ${{ inputs.upstream-checkout-path }}
      run: pnpm install --frozen-lockfile

    - name: fd deploy
      shell: bash
      working-directory: ${{ inputs.upstream-checkout-path }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        GITHUB_APP_PRIVATE_KEY: ${{ inputs.github-app-private-key }}
        FD_OVERLAY: ${{ steps.overlay.outputs.path }}
        FD_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        dry=
        if [ "$FD_DRY_RUN" = "true" ]; then dry=--dry-run; fi
        node --experimental-strip-types --no-warnings packages/ops/scripts/fd-operability.ts deploy --overlay "@$FD_OVERLAY" ${dry:+"$dry"}

    - name: Deployment summary
      if: success()
      shell: bash
      env:
        UPSTREAM_REPO: ${{ inputs.upstream-repo }}
        UPSTREAM_SHA: ${{ steps.resolve-pin.outputs.sha }}
        OVERLAY: ${{ inputs.overlay }}
        FD_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        {
          if [ "$FD_DRY_RUN" = "true" ]; then
            echo "## FlareDispatch drift check passed"
          else
            echo "## FlareDispatch deployed"
          fi
          echo
          echo "- **Upstream**: \`$UPSTREAM_REPO\`"
          echo "- **Pinned SHA**: \`$UPSTREAM_SHA\` ([commit](https://github.com/$UPSTREAM_REPO/commit/$UPSTREAM_SHA))"
          echo "- **Overlay**: \`$OVERLAY\`"
        } >> "$GITHUB_STEP_SUMMARY"
