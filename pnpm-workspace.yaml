packages:
  - "packages/*"
  - "apps/dispatcher"
  - "apps/dashboard"
  - "apps/substrate"
  - "apps/control-plane"
  - "apps/docs"
  - "runs"
  # The shared coordination library, vendored as a git submodule. Its packages
  # export TypeScript sources, which the v2 packages consume as `workspace:*`.
  - "vendor/mameko/packages/*"

# Pin effect 3 to the reference's proven patch. effect 3.21.3+ shifts a type
# inference (the R channel widens never->any) that trips typecheck in a few
# suites; 3.21.2 is the version the whole substrate was validated against.
# The selector covers effect 3 only: the v2 packages and vendor/mameko pin
# effect at exactly 4.0.6 in their own manifests.
#
# @effect/platform-node 4.0.6 depends on @effect/platform-node-shared ^4.0.6, and
# 4.1.0 peers on effect ^4.1.0. vendor/mameko pins effect 4.0.6, so the 4.x line
# of the shared package stays on the version mameko's own lockfile resolves.
overrides:
  "effect@^3": 3.21.2
  "@effect/platform-node-shared@^4": 4.0.6

# The Merlion packages install from tarballs in apps/docs/vendor/merlion and are
# not on the npm registry, so the release-age check has no publish date to read.
minimumReleaseAgeExclude:
  - "@fractalbox/merlion-*"
  - wrangler@4.140.0

# pnpm 10+ gates dependency lifecycle (build) scripts behind an explicit
# allowlist. These are the packages whose install/postinstall scripts pnpm 9
# ran implicitly; allowing them keeps `pnpm install` from erroring with
# ERR_PNPM_IGNORED_BUILDS after the bump to pnpm 11.
allowBuilds:
  # Pulled in transitively by `tsx` (used by @fractalboxdev/flare-dispatch-cli to
  # run src/main.ts). `@parcel/watcher` ships native bindings via
  # `msgpackr-extract`; both run a postinstall to pick the right prebuilt binary.
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  # Transitive dep of the OTLP/protobuf exporter. Its postinstall is not needed
  # for the browser bundle, but pnpm requires an explicit decision.
  protobufjs: true
  sharp: true
  workerd: true
