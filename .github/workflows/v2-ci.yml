name: v2-ci

# The merge gate of specs/verification.md § Merge gate, one job per required check whose harness exists, and
# `fallback-ci`, the not-required check that runbook R13 accepts while the control plane is down (FD-OPS-027). The
# diagram check and the documentation site build run in the docs job. A push to the default branch runs the same jobs (FD-OPS-030).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STRIP_TYPES: node --experimental-strip-types --no-warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: pnpm test

  # FD-VER-001 to FD-VER-013, FD-VER-034 to FD-VER-037. On a pull request the base commit feeds the removal and reuse
  # checks; the coverage report prints the requirements of the current phase that have no harness entry.
  spec-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: spec-tags
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: $STRIP_TYPES packages/ops/scripts/spec-tags.ts --report ${BASE:+--base "$BASE"}

  # FD-OPS-001, FD-OPS-012, FD-OPS-019 to FD-OPS-021, FD-OPS-026, FD-INT-050, FD-AGT-002, FD-AGT-004: each v2
  # template rendered from the placeholder overlay through the one renderer, the drift check's static checks with the
  # registry validator over the agentic recipes' declarations, then `wrangler deploy --dry-run` on each Worker's rendered
  # configuration. The deploy suites (`test/deploy/`) run `fd deploy` and `fd doctor` over the committed templates
  # against fakes.
  deploy-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      # Each rendered file sits beside its template, so the paths inside it (`main`, each container image, the assets
      # directory) resolve.
      - run: $STRIP_TYPES packages/ops/scripts/drift-check.ts --write
      - run: pnpm exec wrangler deploy --dry-run -c apps/control-plane/control-plane.jsonc
      # The dry-run checks the docs Worker's configuration; the docs job builds the site the assets directory holds.
      - run: mkdir -p apps/docs/dist && pnpm exec wrangler deploy --dry-run -c apps/docs/docs.jsonc
      - run: pnpm --filter @fractalboxdev/flare-dispatch-ops exec vitest run test/deploy

  # FD-VER-033, FD-PROF-002.
  profile-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: $STRIP_TYPES packages/ops/scripts/profile-reference.ts

  # FD-VER-014 to FD-VER-016 and FD-VER-022: the toolchain pin, the forbidden-term scan, `lake build`, `#print axioms`
  # and the append-only regressions file. FD-PROV-073: `tamarin-prover --prove` on `formal/provenance.spthy` at the
  # prover and Maude releases `formal/tamarin-prover.version` pins, each archive checked against its SHA-256.
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat formal/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Tamarin prover and Maude
        env:
          TAMARIN_SHA256: 201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6
          MAUDE_SHA256: 72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c
        run: |
          tamarin="$(awk '$1 == "tamarin-prover" { print $2 }' formal/tamarin-prover.version)"
          maude="$(awk '$1 == "maude" { print $2 }' formal/tamarin-prover.version)"
          curl -fsSL -o "$RUNNER_TEMP/tamarin.tar.gz" \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${tamarin}/tamarin-prover-${tamarin}-linux64-ubuntu.tar.gz"
          echo "${TAMARIN_SHA256}  $RUNNER_TEMP/tamarin.tar.gz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/maude.zip" \
            "https://github.com/maude-lang/Maude/releases/download/Maude${maude}/Maude-${maude}-linux-x86_64.zip"
          echo "${MAUDE_SHA256}  $RUNNER_TEMP/maude.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/prover"
          tar -xzf "$RUNNER_TEMP/tamarin.tar.gz" -C "$RUNNER_TEMP/prover" tamarin-prover
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/prover"
          chmod +x "$RUNNER_TEMP/prover/tamarin-prover" "$RUNNER_TEMP/prover/maude"
          echo "$RUNNER_TEMP/prover" >> "$GITHUB_PATH"
          echo "MAUDE_LIB=$RUNNER_TEMP/prover" >> "$GITHUB_ENV"
      - name: formal
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # The prover prints Unicode; a non-UTF-8 locale aborts its output.
          LC_ALL: C.UTF-8
        run: $STRIP_TYPES packages/ops/scripts/formal-gate.ts ${BASE:+--base "$BASE"}

  # FD-VER-026 to FD-VER-031: only a pull request that changes .github/phase gates; the records come from the nightly
  # runs and the deployed control plane, and a condition with no record fails. The records step reads gate n's
  # V-MEASURE thresholds, page alarms and kill lines from GET /v1/ops/phase-gate on the control plane the deploy
  # workflow targets (FD-VER-028, FD-VER-029).
  #
  # CREDENTIALS. `FD_OPERATOR_OVERLAY`: the operator overlay the deploy reads, for the dispatcher hostname.
  # `FD_ACCESS_CLIENT_ID`, `FD_ACCESS_CLIENT_SECRET`: a Cloudflare Access service token whose common name the overlay
  # lists among `operators`.
  phase-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: phase-gate records
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FD_OPERATOR_OVERLAY: ${{ secrets.FD_OPERATOR_OVERLAY }}
          FD_ACCESS_CLIENT_ID: ${{ secrets.FD_ACCESS_CLIENT_ID }}
          FD_ACCESS_CLIENT_SECRET: ${{ secrets.FD_ACCESS_CLIENT_SECRET }}
        run: $STRIP_TYPES packages/ops/scripts/phase-gate.ts --base "$BASE" --fetch --records .tmp/phase-gate-records.json
      - name: phase-gate
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: $STRIP_TYPES packages/ops/scripts/phase-gate.ts --base "$BASE" --records .tmp/phase-gate-records.json

  # FD-VER-032: mameko's coordinator suites on host-cloudflare under workerd, with FlareDispatch's application ports.
  conf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      # FD-CACHE-041's real-R2 leg runs when the operator provides an R2 token with object read and write on one
      # bucket; without it the leg is skipped and the Miniflare leg still runs.
      - run: pnpm --filter @fractalboxdev/flare-dispatch-conformance test
        env:
          FD_R2_CONFORMANCE_BUCKET: ${{ vars.FD_R2_CONFORMANCE_BUCKET }}
          FD_R2_CONFORMANCE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FD_R2_CONFORMANCE_API_TOKEN: ${{ secrets.FD_R2_CONFORMANCE_API_TOKEN }}

  # FD-VER-024: 100 seeds per V-SIM scenario plus every kept seed.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: $STRIP_TYPES packages/ops/scripts/harness.ts sim

  # FD-VER-025: every V-REPLAY workflow twice over its cached journal.
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: $STRIP_TYPES packages/ops/scripts/harness.ts replay

  # FD-VER-019, FD-VER-022: every kept regression, then 10,000 traces of stagedWriteGate, of placement and of the drift
  # check's profile step against the oracle built from the same commit.
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat formal/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: (cd formal && lake build)
      - run: $STRIP_TYPES packages/ops/scripts/harness.ts diff --traces 10000

  # The V-E2E-LOCAL cloud path: the control plane Worker under workerd with the recorded GitHub fixture server, the
  # dispatch action and the `fd-<subcommand>` executables against it, `fd login` against the Secret Service, which
  # runs in the job's own D-Bus session, and a Rust build through sccache against the compile-cache route. The runner
  # image's stable Rust toolchain builds; sccache is the release the sandbox image pins (`infra/Dockerfile.sandbox-demo`),
  # checked against its SHA-256.
  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: Install sccache
        env:
          SCCACHE_VERSION: v0.18.0
          SCCACHE_SHA256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
        run: |
          name="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${name}.tar.gz"
          echo "${SCCACHE_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$name.tar.gz" --strip-components=1 -C /usr/local/bin "${name}/sccache"
          sccache --version
          cargo --version
      - name: Install the Secret Service
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools dbus-x11
      - name: e2e-local
        run: >-
          dbus-run-session -- sh -c
          'printf e2e | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && pnpm --filter @fractalboxdev/flare-dispatch-control-plane run test:e2e-local'

  # FD-OPS-031: every spec diagram renders, and the site build fails on a broken local link.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: shopt -s globstar && node apps/docs/scripts/check-diagrams.mjs specs/**/*.md
      - run: pnpm --filter @fractalboxdev/flare-dispatch-docs run build

  fallback-ci:
    needs: [lint, typecheck, unit, spec-tags, deploy-dry-run, profile-reference, formal, conf, sim, replay, diff, e2e-local, docs]
    runs-on: ubuntu-latest
    steps:
      - run: echo "every CI command of FD-OPS-026 passed"
