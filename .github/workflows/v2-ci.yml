name: v2-ci

# The merge gate of specs/verification.md § Merge gate, one job per required check whose harness exists, and
# `fallback-ci`, the not-required check that runbook R13 accepts while the control plane is down (FD-OPS-027). The
# documentation site build runs in docs.yml. A push to the default branch runs the same jobs (FD-OPS-030).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRIP_TYPES: node --experimental-strip-types --no-warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: pnpm test

  # FD-VER-001 to FD-VER-013, FD-VER-034 to FD-VER-037. On a pull request the base commit feeds the removal and reuse
  # checks; the coverage report prints the requirements of the current phase that have no harness entry.
  spec-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: spec-tags
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: $STRIP_TYPES packages/ops/scripts/spec-tags.ts --report ${BASE:+--base "$BASE"}

  # FD-OPS-019 to FD-OPS-021, FD-OPS-026, FD-INT-050: each v2 template rendered from the placeholder overlay through the
  # one renderer, the drift check's static checks, then `wrangler deploy --dry-run` on the rendered configuration.
  deploy-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: $STRIP_TYPES packages/ops/scripts/drift-check.ts --out .tmp/rendered
      - run: pnpm exec wrangler deploy --dry-run -c .tmp/rendered/control-plane.jsonc

  # FD-VER-033, FD-PROF-002.
  profile-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - run: $STRIP_TYPES packages/ops/scripts/profile-reference.ts

  # FD-VER-014 to FD-VER-016 and FD-VER-022: the toolchain pin, the forbidden-term scan, `lake build`, `#print axioms`
  # and the append-only regressions file.
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat formal/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: formal
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: $STRIP_TYPES packages/ops/scripts/formal-gate.ts ${BASE:+--base "$BASE"}

  # FD-VER-026 to FD-VER-031: only a pull request that changes .github/phase gates; the records come from the nightly
  # runs and the deployed control plane, and a condition with no record fails.
  phase-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: phase-gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: $STRIP_TYPES packages/ops/scripts/phase-gate.ts --base "$BASE" --records .tmp/phase-gate-records.json

  fallback-ci:
    needs: [lint, typecheck, unit, spec-tags, deploy-dry-run, profile-reference, formal]
    runs-on: ubuntu-latest
    steps:
      - run: echo "every CI command of FD-OPS-026 passed"
