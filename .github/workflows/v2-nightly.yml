name: v2-nightly

# The nightly harnesses on the default branch's head (specs/verification.md § Harness catalog): 1,000,000 traces of
# `stagedWriteGate` against its oracle (FD-VER-020), 10,000 seeds per `V-SIM` scenario (FD-VER-024) and the device
# path of `V-E2E-LOCAL`. A differing trace or a failing seed opens a pull request that appends it to
# `formal/regressions.jsonl` or `test/sim/seeds.jsonl` (FD-VER-021, FD-VER-024). The phase gate reads these runs' conclusions (FD-VER-027).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  STRIP_TYPES: node --experimental-strip-types --no-warnings

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat formal/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: (cd formal && lake build)
      - name: diff, 1,000,000 traces
        id: diff
        run: $STRIP_TYPES packages/ops/scripts/harness.ts diff --traces 1000000 --emit "$RUNNER_TEMP/regression.jsonl"
      - name: Propose the regression line
        if: failure() && hashFiles(format('{0}/regression.jsonl', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="nightly/diff-regression-${{ github.run_id }}"
          git switch -c "$branch"
          cat "$RUNNER_TEMP/regression.jsonl" >> formal/regressions.jsonl
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -am "test(formal): keep the trace the nightly diff run found"
          git push origin "$branch"
          gh pr create --title "test(formal): keep a differing stagedWriteGate trace" \
            --body "The nightly diff run found a trace whose outputs differ; this appends it to formal/regressions.jsonl."

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: sim, 10,000 seeds per scenario
        run: $STRIP_TYPES packages/ops/scripts/harness.ts sim --seeds 10000 --emit "$RUNNER_TEMP/seeds.jsonl"
      - name: Propose the failing seeds
        if: failure() && hashFiles(format('{0}/seeds.jsonl', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="nightly/sim-seeds-${{ github.run_id }}"
          git switch -c "$branch"
          mkdir -p test/sim
          cat "$RUNNER_TEMP/seeds.jsonl" >> test/sim/seeds.jsonl
          git add test/sim/seeds.jsonl
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "test(sim): keep the seeds the nightly sim run failed"
          git push origin "$branch"
          gh pr create --title "test(sim): keep failing simulation seeds" \
            --body "The nightly sim run failed these seeds; this appends them to test/sim/seeds.jsonl."

  # The device path of V-E2E-LOCAL: the control plane under `wrangler dev`, the key helper and the device executor
  # built from the pinned vendor/mameko, running the gate recipes under the host-process job runtime.
  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v2-setup
        with:
          mameko-deploy-key: ${{ secrets.MAMEKO_DEPLOY_KEY }}
      - name: e2e-local, device path
        run: pnpm --filter @fractalboxdev/flare-dispatch-control-plane run test:e2e-local-device
