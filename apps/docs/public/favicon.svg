<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f4f1ea"/>
  <!-- Trajectory arc: launch from bottom-left, arcs up into the flare at (42,22) -->
  <path d="M8 58 Q10 38 26 30 T42 22" fill="none" stroke="#13131A" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Flare burst at (42,22) in Cloudflare visual language: CF orange palette, soft rounded
       petal-rays (smooth Bézier curves, not sharp diamonds), asymmetric for upward-right
       velocity. No cloud silhouette — pure flare. -->
  <g transform="translate(42 22)">
    <!-- 8 petal-rays in CF orange. Each petal uses a single closed path with two
         control points giving a teardrop silhouette: pointed tip, rounded base. -->
    <!-- N (longest) -->
    <path d="M0 -25 C 4 -15, 4 -5, 0 -2 C -4 -5, -4 -15, 0 -25 Z" fill="#F38020"/>
    <!-- E (long) -->
    <path d="M25 0 C 15 4, 5 4, 2 0 C 5 -4, 15 -4, 25 0 Z" fill="#F38020"/>
    <!-- NE (long diagonal) -->
    <path d="M18 -18 C 11 -7, 4 -3, 0 0 C -3 -4, 5 -10, 18 -18 Z M18 -18 C 14 -14, 6 -8, 0 -2 C -2 -4, 8 -12, 18 -18 Z" fill="#F38020"/>
    <!-- S (medium-long) -->
    <path d="M0 22 C 4 13, 4 5, 0 2 C -4 5, -4 13, 0 22 Z" fill="#F38020"/>
    <!-- W (medium) -->
    <path d="M-20 0 C -12 4, -5 4, -2 0 C -5 -4, -12 -4, -20 0 Z" fill="#F38020"/>
    <!-- SE (medium) -->
    <path d="M14 14 C 8 4, 4 1, 0 0 C 0 4, 4 8, 14 14 Z" fill="#F38020"/>
    <!-- SW (medium) -->
    <path d="M-15 15 C -8 4, -4 1, 0 0 C 0 4, -4 8, -15 15 Z" fill="#F38020"/>
    <!-- NW (short) -->
    <path d="M-12 -12 C -6 -3, -2 -1, 0 0 C 0 -2, -3 -6, -12 -12 Z" fill="#F38020"/>
    <!-- Hot center: CF orange disc → CF golden halo → white incandescent core -->
    <circle r="6.5" fill="#F38020"/>
    <circle r="4" fill="#FAAE40"/>
    <circle r="1.6" fill="#FFFFFF"/>
  </g>
</svg>
