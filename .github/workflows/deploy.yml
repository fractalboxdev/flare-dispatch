name: deploy

# Redeploy the FlareDispatch dispatcher Worker when upstream (main) updates.
# Container images (infra/Dockerfile.sandbox) are (re)built by `wrangler deploy`
# on the runner, so this needs Docker — ubuntu-latest provides it. The path
# filter keeps doc-only commits from triggering an image rebuild.
#
# CREDENTIALS. `CLOUDFLARE_API_TOKEN` — account-scoped to FractalBox
# (c91d52c2…), no zone resources: Workers Scripts:Edit, Workers KV:Edit,
# Workers R2:Edit, D1:Edit, Containers:Edit, Account Settings:Read.
# Created 2026-08-06 · dash.cloudflare.com/profile/api-tokens · no expiry.
# Scope is recorded here because GitHub secrets have no comment field and a
# Cloudflare token cannot report its own policies — reading them needs a
# *second* token with API Tokens:Read, so an undocumented token's grants are
# unrecoverable in practice. `Containers:Edit` is the one the "Edit Cloudflare
# Workers" template omits; without it the substrate's four container
# applications fail to deploy.
#
# Zone resources are deliberately none: both workers serve on workers.dev, so
# a token that could touch DNS would be strictly more blast radius than the
# job can use.
#
# The token is account-scoped only, so `GET /user/tokens/verify` returns
# "Invalid API Token" for it — that endpoint lives under /user/ and needs
# user-level access. Verify against `GET /accounts/{id}` instead; a 200 with
# `success: true` is the real signal.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "runs/**"
      - "infra/**"
      - "schemas/**"
      - "wrangler.jsonc"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# Never let two deploys race onto the same Worker.
concurrency:
  group: deploy-flare-dispatch
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The substrate deploys BEFORE the dispatcher, and its own job rather than a
  # step in `deploy`, because the ordering is a real constraint and not a
  # preference: consumers' service bindings resolve against a Worker that must
  # already exist (apps/substrate/specs/platform.md). `needs:` is what encodes
  # it — a step ordering inside one job would be lost the moment someone adds a
  # matrix or reorders for speed.
  #
  # It also means a substrate deploy that fails stops the dispatcher's, which is
  # the correct blast radius: half a topology is worse than none of it.
  substrate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy -c apps/substrate/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploy from the repo root, which wrangler.jsonc points at
      # (main: apps/dispatcher/src/index.ts). Uses the pnpm-pinned wrangler.
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
