name: actions-ci

# Lint + unit-test the consumable composite actions under actions/. These ship
# to downstream repos, so their bash is gated on its own: shellcheck for the
# script, bats for the pure helpers in dispatch.sh (sourced without dispatching,
# thanks to its guarded `main`). Path-filtered so unrelated changes don't run it.
on:
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/actions-ci.yml"
  push:
    branches: [main]
    paths:
      - "actions/**"
      - ".github/workflows/actions-ci.yml"

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck, jq, and openssl are preinstalled on ubuntu-latest runners.
      - name: shellcheck
        run: shellcheck actions/flare-dispatch-action/dispatch.sh
      - name: install bats
        run: npm install -g bats
      - name: bats
        run: bats actions/flare-dispatch-action/dispatch.bats
