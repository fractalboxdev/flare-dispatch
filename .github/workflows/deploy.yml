name: deploy

# MANUAL DEPLOY ONLY (for now). Hosted GitHub Actions runners are unavailable on
# this account, so an auto-deploy-on-push cannot start a runner — it only leaves
# a failing red run on every push to main. Until that changes, deploy from a
# workstation with `pnpm run deploy` (gates on lint + typecheck + test, then
# `wrangler deploy`; needs Docker for the container image build + a wrangler
# login on the target account). See AGENTS.md § Deploy.
#
# The job below is kept as a `workflow_dispatch` entry so it can be triggered
# (or the `push:` trigger restored) the moment runners become available — the
# steps are the same gate the manual path runs.
on:
  workflow_dispatch: {}

# Never let two deploys race onto the same Worker.
concurrency:
  group: deploy-flare-dispatch
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploy from the repo root, which wrangler.jsonc points at
      # (main: apps/dispatcher/src/index.ts). Uses the pnpm-pinned wrangler.
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
